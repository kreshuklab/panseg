name: Manually run tests on all platforms

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        # TEMPORARY (macOS freeze bisect): macOS only, proofreading tests only.
        os: ["macos-latest"]
    runs-on: ["${{ matrix.os }}"]
    # Fail fast instead of hanging for hours when a test freezes (e.g. Qt/GL
    # regressions on the macOS runners).
    timeout-minutes: 45

    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'powershell' || 'bash -el {0}' }}

    steps:
      - name: Setup Qt headless display
        uses: pyvista/setup-headless-display-action@v4.3
        with:
          qt: true

      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Miniforge
        uses: conda-incubator/setup-miniconda@v4.0.0
        with:
          python-version: 3.12
          miniforge-version: latest
          mamba-version: "*"
          channels: local,conda-forge
          environment-file: "environment-dev.yaml"
          activate-environment: "panseg-dev"
          conda-remove-defaults: true

      - name: Run checks
        # TEMPORARY (macOS freeze bisect): proofreading tests only, thread-method
        # timeout -- unlike the signal method it works when the main thread is
        # wedged inside a C call, dumps all thread stacks, and exits the process
        # so the job fails fast with logs instead of hanging to the job timeout.
        run: |
          panseg --help
          pytest tests/widgets/test_proofreading.py -v --durations=10 --timeout=300 --timeout-method=thread
