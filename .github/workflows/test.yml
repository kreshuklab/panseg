name: Run tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  test-linux:
    runs-on: ubuntu-22.04
    env:
      DISPLAY: ":99.0"

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      # Cache the downloaded models across runs. The key is a hash of the
      # files that declare which models the tests download (the PanSeg zoo
      # config and the BioImage.IO test model ids)
      - name: Compute model zoo cache key
        id: model-zoo-key
        run: |
          files="panseg/resources/models_zoo.yaml tests/core/test_zoo.py"
          echo "hash=$(git rev-parse HEAD:$files | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache PanSeg models
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.panseg_models
            ~/.cache/bioimageio
            ~/.cache/pooch
          key: panseg-models-${{ steps.model-zoo-key.outputs.hash }}
          restore-keys: |
            panseg-models-

      - name: Setup Qt headless display
        uses: pyvista/setup-headless-display-action@v4.3
        with:
          qt: true

      # mkl 2026.2.0 lacks libmkl_gf_lp64 on Linux, so numpy aborts on import
      # (conda-forge/intel_repack-feedstock#145). Remove once that build is marked broken.
      - name: Pin mkl below 2026.2 on Linux (temporary)
        if: runner.os == 'Linux'
        run: |
          sed -i 's/^dependencies:$/dependencies:\n  - mkl<2026.2/' environment-dev.yaml

      # Set up Miniconda
      - name: Set Up Miniforge
        uses: conda-incubator/setup-miniconda@v4.0.0
        with:
          python-version: 3.12
          miniforge-version: latest
          mamba-version: "*"
          channels: local,conda-forge
          environment-file: "environment-dev.yaml"
          activate-environment: "panseg-dev"
          conda-remove-defaults: true

      # Display available Conda environments (for debugging purposes)
      - name: List Conda Environments
        shell: bash -l {0}
        run: conda info --envs

      # Run tests using pytest
      - name: Run Tests with Pytest
        shell: bash -l {0}
        run: |
          conda activate panseg-dev
          pytest --cov --cov-report=xml --durations=10
          conda deactivate

      # Upload Codecov report
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
